name: Publish development web preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-development
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_WEB_PUBLISH_ROLE_ARN: ${{ vars.AWS_WEB_PUBLISH_ROLE_ARN }}
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci --workspaces --include-workspace-root=false --no-audit --no-fund
      - name: Validate manual development release configuration
        run: node infra/src/check-web-release.ts environment
      - run: npm run lint --workspace @rct/consulting-infra
      - run: npm run check:foundation
      - run: node packages/contracts/src/verify-pin.ts
      - run: npm audit --workspaces --include-workspace-root=false --audit-level=high
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_WEB_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
      - name: Read and validate the existing development stack
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name rct-consulting-development-foundation > "$RUNNER_TEMP/preview-stack.json"
          node infra/src/check-web-release.ts stack "$RUNNER_TEMP/preview-stack.json"
      - name: Verify destination ownership and API readiness
        shell: bash
        run: |
          set -euo pipefail
          aws s3api get-bucket-location --bucket "$PREVIEW_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" > /dev/null
          aws s3api get-public-access-block --bucket "$PREVIEW_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" > "$RUNNER_TEMP/preview-access-block.json"
          aws s3api get-bucket-policy-status --bucket "$PREVIEW_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" > "$RUNNER_TEMP/preview-policy-status.json"
          node infra/src/check-web-release.ts bucket "$RUNNER_TEMP/preview-access-block.json" "$RUNNER_TEMP/preview-policy-status.json"
          aws cloudfront get-distribution --id "$PREVIEW_DISTRIBUTION_ID" > "$RUNNER_TEMP/preview-distribution.json"
          node infra/src/check-web-release.ts distribution "$RUNNER_TEMP/preview-distribution.json"
          curl --fail --retry 3 --retry-all-errors --max-time 30 --silent --show-error "$PREVIEW_API_URL/health" > "$RUNNER_TEMP/preview-health.json"
          node infra/src/check-web-release.ts health "$RUNNER_TEMP/preview-health.json"
          status=$(curl --max-time 30 --silent --show-error --output /dev/null --write-out "%{http_code}" "$PREVIEW_API_URL/admin/leads")
          test "$status" = "401"
      - name: Build the gated development application
        run: npm run build:web
        env:
          VITE_ADMIN_AUTH_URL: ${{ env.PREVIEW_AUTH_URL }}
          VITE_ADMIN_API_URL: ${{ env.PREVIEW_API_URL }}
          VITE_ADMIN_CLIENT_ID: ${{ env.PREVIEW_CLIENT_ID }}
          VITE_ADMIN_USER_POOL_ID: ${{ env.PREVIEW_USER_POOL_ID }}
          VITE_LEAD_INTAKE_ENABLED: "false"
          VITE_LEAD_CONSENT_POLICY_VERSION: ""
          VITE_LEAD_CONSENT_COPY: ""
          VITE_API_URL: ""
      - name: Publish only the modern preview output
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/web/dist/index.html
          aws s3 sync apps/web/dist/ "s3://$PREVIEW_BUCKET/" --exclude "*" --include "assets/*" --cache-control "public,max-age=31536000,immutable" --only-show-errors
          for html in apps/web/dist/index.html apps/web/dist/route-meta/*.html; do
            key=$(printf '%s' "$html" | sed 's#^apps/web/dist/##')
            aws s3 cp "$html" "s3://$PREVIEW_BUCKET/$key" --content-type "text/html" --cache-control "no-cache" --only-show-errors
          done
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$PREVIEW_DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$PREVIEW_DISTRIBUTION_ID" --id "$invalidation"
      - name: Verify the published entry point
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --max-time 30 --silent --show-error "$PREVIEW_WEB_URL/" > "$RUNNER_TEMP/published-preview.html"
          cmp apps/web/dist/index.html "$RUNNER_TEMP/published-preview.html"
          for html in apps/web/dist/route-meta/*.html; do
            key=$(printf '%s' "$html" | sed 's#^apps/web/dist/##')
            curl --fail --retry 3 --retry-all-errors --max-time 30 --silent --show-error "$PREVIEW_WEB_URL/$key" > "$RUNNER_TEMP/published-route.html"
            cmp "$html" "$RUNNER_TEMP/published-route.html"
          done
          route_metadata_active=true
          for route in /small-business /enterprise /work /services /approach /about /faq /contact \
            /services/digital-foundations /services/engineering-solutions /services/fractional-leadership \
            /services/ai-automation /services/cloud-cost-optimization; do
            route_file=$(printf '%s' "$route" | sed 's#^/##; s#/#--#g')
            status=$(curl --retry 3 --retry-all-errors --max-time 30 --silent --show-error \
              --output "$RUNNER_TEMP/published-route.html" --write-out "%{http_code}" "$PREVIEW_WEB_URL$route")
            if test "$route" = "/work" && { test "$status" = "403" || test "$status" = "404"; }; then
              route_metadata_active=false
              continue
            fi
            test "$status" = "200"
            if ! cmp "apps/web/dist/route-meta/$route_file.html" "$RUNNER_TEMP/published-route.html"; then
              cmp apps/web/dist/index.html "$RUNNER_TEMP/published-route.html"
              route_metadata_active=false
            fi
          done
          for asset in apps/web/dist/assets/*; do
            test -f "$asset"
            name=$(basename "$asset")
            curl --fail --retry 3 --retry-all-errors --max-time 30 --silent --show-error "$PREVIEW_WEB_URL/assets/$name" > "$RUNNER_TEMP/published-asset"
            cmp "$asset" "$RUNNER_TEMP/published-asset"
          done
          printf 'Development preview: %s\n\nPublic inquiry collection remains disabled.\n' "$PREVIEW_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          if test "$route_metadata_active" = true; then
            printf 'Static route metadata is active for approved page URLs.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Route metadata shells are staged and verified; deploy the infrastructure route mapping to activate them.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
